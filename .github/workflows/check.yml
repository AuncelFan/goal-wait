name: Check goal-wait
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        codex: ["0.162.1", "0.163.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --global @openai/codex@${{ matrix.codex }}
      - run: python3 -m unittest discover -s tests -v
      - run: node tests/integration.mjs
      - name: Validate Skills CLI discovery
        run: npx --yes skills add . --skill goal-wait --list
